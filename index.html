<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA VYQ | Elegancia y Estilo</title>
    <style>
        :root {
            --dorado: #d4af37;
            --negro: #121212;
            --gris-oscuro: #1e1e1e;
            --fondo: #f8f9fa;
            --texto: #212529;
            --borde: #e0e0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--fondo); color: var(--texto); line-height: 1.6; padding-bottom: 70px; }
        header { background-color: var(--negro); color: var(--dorado); text-align: center; padding: 30px 15px; border-bottom: 4px solid var(--dorado); }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; }
        header p { color: #cccccc; font-size: 1rem; margin-top: 5px; }
        
        nav { background-color: var(--gris-oscuro); display: flex; justify-content: center; gap: 20px; padding: 12px; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; align-items: center; }
        nav a { color: #ffffff; text-decoration: none; font-weight: 600; }
        nav a:hover { color: var(--dorado); }
        .nav-carrito-btn { background-color: #25d366; color: #fff !important; padding: 6px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; border: none; font-size: 0.95rem; }
        .nav-carrito-btn:hover { background-color: #20ba5a; }

        main { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .categoria-titulo { font-size: 1.8rem; color: var(--negro); margin: 30px 0 15px; border-left: 5px solid var(--dorado); padding-left: 10px; }
        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .producto { background: #ffffff; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .producto-imagen { width: 100%; height: 220px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid #f0f0f0; }
        .producto-imagen img { width: 100%; height: 100%; object-fit: cover; }
        .producto-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .marca-tag { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #888; margin-bottom: 5px; }
        .producto-info h3 { font-size: 1.1rem; color: var(--negro); margin-bottom: 8px; }
        .producto-info p { font-size: 0.85rem; color: #666; margin-bottom: 12px; flex-grow: 1; }
        .precio-linea { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .precio { font-size: 1.2rem; font-weight: bold; color: #b12704; }
        .btn-comprar { background-color: var(--dorado); color: var(--negro); border: none; padding: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 0.95rem; }
        .btn-comprar:hover { background-color: #f3e5ab; }

        /* MODAL DE PEDIDO */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; }
        .modal-contenido { background: #fff; padding: 25px; border-radius: 10px; width: 90%; max-width: 450px; box-shadow: 0 5px 25px rgba(0,0,0,0.4); max-height: 90vh; overflow-y: auto; }
        .modal-contenido h3 { margin-bottom: 15px; color: var(--negro); border-bottom: 2px solid var(--dorado); padding-bottom: 5px; }
        .form-grupo { margin-bottom: 12px; display: flex; flex-direction: column; }
        .form-grupo label { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-grupo input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.95rem; }
        .btn-enviar-wa { background-color: #25d366; color: #fff; border: none; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; }
        .btn-enviar-wa:hover { background-color: #20ba5a; }
        .btn-cerrar { background-color: #ccc; color: #333; border: none; padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; }

        footer { background-color: var(--negro); color: #ffffff; text-align: center; padding: 20px; margin-top: 50px; border-top: 3px solid var(--dorado); }
    </style>
</head>
<body>

    <header>
        <h1>TIENDA VYQ</h1>
        <p>Elegancia, estilo y distinción • Bolivia</p>
    </header>

    <nav>
        <a href="#perfumeria">Perfumería</a>
        <a href="#ropa">Ropa y Prendas</a>
        <button type="button" class="nav-carrito-btn" onclick="abrirModal()">🛒 Ver Carrito (<span id="contador-nav">0</span>)</button>
    </nav>

    <!-- MODAL DE PEDIDO -->
    <div id="modal-pedido" class="modal-overlay">
        <div class="modal-contenido">
            <h3>Tu Carrito y Datos de Pedido</h3>
            <div id="resumen-carrito" style="font-size: 0.9rem; margin-bottom: 15px; color: #555; background: #f9f9f9; padding: 10px; border-radius: 5px;"></div>
            
            <div class="form-grupo">
                <label for="cliente-nombre">Tu Nombre:</label>
                <input type="text" id="cliente-nombre" placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-grupo">
                <label for="cliente-edad">Tu Edad:</label>
                <input type="number" id="cliente-edad" placeholder="Ej. 18">
            </div>

            <div class="form-grupo">
                <label for="cliente-talla">Talla (o ml en perfumes):</label>
                <input type="text" id="cliente-talla" placeholder="Ej. Talla L / 50ml">
            </div>

            <div class="form-grupo">
                <label for="cliente-fecha">¿Para cuándo lo quieres?:</label>
                <input type="text" id="cliente-fecha" placeholder="Ej. Para este viernes / Urgente">
            </div>

            <button type="button" class="btn-enviar-wa" onclick="enviarPedidoWhatsApp()">📲 Enviar Pedido al 63062304</button>
            <button type="button" class="btn-cerrar" onclick="cerrarModal()">Cerrar / Seguir viendo</button>
        </div>
    </div>

    <main>
        <h2 class="categoria-titulo" id="perfumeria">Perfumería</h2>
        <div class="catalogo" id="catalogo-perfumeria"></div>

        <h2 class="categoria-titulo" id="ropa">Ropa y Prendas</h2>
        <div class="catalogo" id="catalogo-ropa"></div>
    </main>

    <footer>
        <p>&copy; 2026 TIENDA VYQ. Sexto de Secundaria. Proyecto de Grado.</p>
    </footer>

    <script>
        var productosBase = [
            { id: 1, nombre: "Expression Sens", categoria: "Perfumería", marca: "Ésika", precio: 145, desc: "Aroma Chipre floral elegante. Contenido: 50 ml.", img: "img/Imagen 2.jpg" },
            { id: 2, nombre: "Expression Magic", categoria: "Perfumería", marca: "Ésika", precio: 145, desc: "Aroma floral frutal cautivador. Contenido: 50 ml.", img: "img/Imagen 20.jpg" },
            { id: 3, nombre: "Sweet Black Intense", categoria: "Perfumería", marca: "Cyzone", precio: 115, desc: "Aroma dulce intenso juvenil. Contenido: 50 ml.", img: "img/Imagen 15.jpg" },
            { id: 4, nombre: "All Black", categoria: "Perfumería", marca: "Cyzone", precio: 115, desc: "Aroma oriental maderoso. Contenido: 90 ml.", img: "img/Imagen 3.jpg" },
            { id: 5, nombre: "Nitro Air", categoria: "Perfumería", marca: "Cyzone", precio: 115, desc: "Aroma herbal fresco con lavanda. Contenido: 100 ml.", img: "img/Imagen 11.jpg" },
            { id: 6, nombre: "Sudadera Nike Clásica Naranja", categoria: "Ropa", marca: "Nike", precio: 150, desc: "Prenda deportiva con swoosh bordado. Talla L.", img: "img/Imagen 13.jpg" },
            { id: 7, nombre: "Sudadera Nike Fayetteville Tech", categoria: "Ropa", marca: "Nike", precio: 150, desc: "Estilo deportivo universitario premium.", img: "img/Imagen 23.jpg" },
            { id: 8, nombre: "Sweater Tommy Hilfiger", categoria: "Ropa", marca: "Tommy Hilfiger", precio: 160, desc: "Diseño casual elegante con bordado distintivo.", img: "img/Imagen 16.jpg" },
            { id: 9, nombre: "Chaqueta Deportiva Jordan Basketball", categoria: "Ropa", marca: "Jordan", precio: 180, desc: "Chaqueta azul marino con detalles blancos.", img: "img/Imagen 7.jpg" },
            { id: 10, nombre: "Chamarra Gamuza con Forro Polar", categoria: "Ropa", marca: "ANG", precio: 195, desc: "Abrigo marrón tipo gamuza con cuello de corderito.", img: "img/Imagen 19.jpg" },
            { id: 11, nombre: "Sudadera Roja de Corazones", categoria: "Ropa", marca: "ANG / Urbano", precio: 130, desc: "Diseño casual rojo con detalles de corazones blancos.", img: "img/Imagen 4.jpg" },
            { id: 12, nombre: "Sudadera Roja Stardust", categoria: "Ropa", marca: "ANG / Urbano", precio: 130, desc: "Estilo urbano con estampado bordado frontal.", img: "img/Imagen 5.jpg" },
            { id: 13, nombre: "Sudadera Gris Garris Evans", categoria: "Ropa", marca: "ANG / Urbano", precio: 135, desc: "Estilo clásico en color gris con estampado corporativo.", img: "img/Imagen 22.jpg" },
            { id: 14, nombre: "Sudadera Negra Lisa", categoria: "Ropa", marca: "ANG / Urbano", precio: 140, desc: "Estilo minimalista en color negro.", img: "img/Imagen 9.jpg" },
            { id: 15, nombre: "Sudadera Negra con Bolsillo Canguro", categoria: "Ropa", marca: "ANG / Urbano", precio: 140, desc: "Diseño urbano negro con bolsillo frontal.", img: "img/Imagen 10.jpg" },
            { id: 16, nombre: "Sudadera Azul Pack National Team", categoria: "Ropa", marca: "ANG / Urbano", precio: 145, desc: "Estilo deportivo con estampado frontal y estrellas.", img: "img/Imagen 12.jpg" },
            { id: 17, nombre: "Sudadera Verde Sláinte", categoria: "Ropa", marca: "ANG / Urbano", precio: 140, desc: "Estilo verde oscuro con trébol de la suerte.", img: "img/Imagen 1.jpg" },
            { id: 18, nombre: "Chamarra Acolchada Geométrica", categoria: "Ropa", marca: "ANG", precio: 185, desc: "Diseño moderno con cuello alto y patrones exclusivos.", img: "img/Imagen 6.jpg" }
        ];

        function obtenerProductos() {
            var guardados = localStorage.getItem("vyq_productos_v4");
            if (!guardados) {
                localStorage.setItem("vyq_productos_v4", JSON.stringify(productosBase));
                return productosBase;
            }
            var prodsGuardados = JSON.parse(guardados);
            for (var i = 0; i < prodsGuardados.length; i++) {
                for (var j = 0; j < productosBase.length; j++) {
                    if (prodsGuardados[i].id === productosBase[j].id) {
                        if (!prodsGuardados[i].marca) prodsGuardados[i].marca = productosBase[j].marca;
                        if (!prodsGuardados[i].desc) prodsGuardados[i].desc = productosBase[j].desc;
                        if (!prodsGuardados[i].img) prodsGuardados[i].img = productosBase[j].img;
                        if (!prodsGuardados[i].categoria) prodsGuardados[i].categoria = productosBase[j].categoria;
                        break;
                    }
                }
            }
            return prodsGuardados;
        }

        function renderizarTienda() {
            var prods = obtenerProductos();
            var htmlPerfumeria = "";
            var htmlRopa = "";

            for (var i = 0; i < prods.length; i++) {
                var p = prods[i];
                var tarjeta = '<article class="producto">' +
                    '<div class="producto-imagen"><img src="' + (p.img || 'img/Imagen 1.jpg') + '" alt="' + p.nombre + '"></div>' +
                    '<div class="producto-info">' +
                        '<span class="marca-tag">' + (p.marca || 'TIENDA VYQ') + '</span>' +
                        '<h3>' + p.nombre + '</h3>' +
                        '<p>' + (p.desc || 'Disponible en tienda') + '</p>' +
                        '<div class="precio-linea"><span class="precio">Bs. ' + p.precio + '</span></div>' +
                        '<button type="button" class="btn-comprar" onclick="agregarAlCarrito(\'' + p.nombre.replace(/'/g, "\\'") + '\', ' + p.precio + ')">Añadir al carrito</button>' +
                    '</div>' +
                '</article>';

                if (p.categoria === "Perfumería") {
                    htmlPerfumeria += tarjeta;
                } else {
                    htmlRopa += tarjeta;
                }
            }

            document.getElementById("catalogo-perfumeria").innerHTML = htmlPerfumeria;
            document.getElementById("catalogo-ropa").innerHTML = htmlRopa;
        }

        var carritoCompras = [];

        function agregarAlCarrito(nombre, precio) {
            carritoCompras.push({ nombre: nombre, precio: precio });
            var contadorNav = document.getElementById("contador-nav");
            if (contadorNav) {
                contadorNav.textContent = carritoCompras.length;
            }
            alert("✅ ¡Agregado al carrito: " + nombre + "!");
        }

        function abrirModal() {
            if (carritoCompras.length === 0) {
                alert("🛒 Tu carrito está vacío. Añade al menos un producto.");
                return;
            }

            var htmlResumen = "<b>Productos en tu carrito:</b><br><ul>";
            var total = 0;
            for (var i = 0; i < carritoCompras.length; i++) {
                htmlResumen += "<li>" + carritoCompras[i].nombre + " - Bs. " + carritoCompras[i].precio + "</li>";
                total += carritoCompras[i].precio;
            }
            htmlResumen += "</ul><br><b>Total a Pagar: Bs. " + total + "</b>";

            document.getElementById("resumen-carrito").innerHTML = htmlResumen;
            document.getElementById("modal-pedido").style.display = "flex";
        }

        function cerrarModal() {
            document.getElementById("modal-pedido").style.display = "none";
        }

        function enviarPedidoWhatsApp() {
            var nombre = document.getElementById("cliente-nombre").value.trim();
            var edad = document.getElementById("cliente-edad").value.trim();
            var talla = document.getElementById("cliente-talla").value.trim();
            var fecha = document.getElementById("cliente-fecha").value.trim();

            if (!nombre || !edad || !talla || !fecha) {
                alert("⚠️ Por favor, llena todos tus datos (Nombre, Edad, Talla y Para cuándo lo quieres).");
                return;
            }

            var mensaje = "¡Hola! TIENDA VYQ, quiero realizar este pedido:\n\n";
            var total = 0;

            for (var i = 0; i < carritoCompras.length; i++) {
                mensaje += (i + 1) + ". " + carritoCompras[i].nombre + " - Bs. " + carritoCompras[i].precio + "\n";
                total += carritoCompras[i].precio;
            }

            mensaje += "\n*Total a pagar:* Bs. " + total + "\n\n";
            mensaje += "📋 *Datos del Cliente:*\n";
            mensaje += "• Nombre: " + nombre + "\n";
            mensaje += "• Edad: " + edad + "\n";
            mensaje += "• Talla / Modelo: " + talla + "\n";
            mensaje += "• Para cuándo lo quieres: " + fecha + "\n";

            var urlWhatsApp = "https://wa.me/59163062304?text=" + encodeURIComponent(mensaje);
            window.open(urlWhatsApp, "_blank");
            cerrarModal();
        }

        window.onload = function() {
            renderizarTienda();
        };
    </script>
</body>
</html>
