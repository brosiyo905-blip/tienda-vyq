<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA VYQ | Catálogo Oficial</title>
    <style>
        :root {
            --dorado: #d4af37;
            --negro: #12141c;
            --tarjeta: #1b1e29;
            --borde: #323748;
            --texto: #f8f9fa;
            --texto-dim: #9ba0b2;
            --verde: #25d366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--negro); color: var(--texto); padding: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--tarjeta); padding: 15px 25px; border-radius: 10px; border: 1px solid var(--borde); margin-bottom: 25px; }
        header h1 { font-size: 1.5rem; color: var(--dorado); letter-spacing: 1px; }
        header a { color: var(--dorado); text-decoration: none; font-size: 0.9rem; font-weight: bold; border: 1px solid var(--dorado); padding: 6px 12px; border-radius: 6px; transition: 0.2s; }
        header a:hover { background: var(--dorado); color: var(--negro); }

        .container { max-width: 1200px; margin: 0 auto; }
        
        /* GRID DE PRODUCTOS LIMPIO Y RESPONSIVO */
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        
        .product-card { 
            background: var(--tarjeta); 
            border: 1px solid var(--borde); 
            border-radius: 10px; 
            padding: 18px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .product-card:hover { border-color: var(--dorado); transform: translateY(-3px); }
        .product-card h4 { font-size: 1.05rem; margin-bottom: 6px; color: var(--texto); }
        .product-card .category { font-size: 0.8rem; color: var(--texto-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .product-card .price { font-size: 1.25rem; font-weight: bold; color: var(--dorado); margin-bottom: 15px; }
        
        .btn-add { 
            background: #242836; 
            color: var(--texto); 
            border: 1px solid var(--borde); 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            transition: 0.2s;
        }
        .btn-add:hover { background: var(--dorado); color: var(--negro); border-color: var(--dorado); }

        /* CARRITO */
        .cart-drawer { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 20px; margin-bottom: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borde); padding: 10px 0; font-size: 0.95rem; }
        .cart-btn { background: var(--dorado); color: #121212; padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .cart-btn:hover { background: #f3e5ab; }

        /* MODAL */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 15px; }
        .modal { background: var(--tarjeta); padding: 25px; border-radius: 12px; border: 1px solid var(--borde); width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal input, .modal textarea { width: 100%; background: #12141c; border: 1px solid var(--borde); color: #fff; padding: 10px; margin-bottom: 12px; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        .modal input:focus, .modal textarea:focus { border-color: var(--dorado); outline: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TIENDA VYQ</h1>
            <a href="admin.html" target="_blank">⚙️ Panel Admin ↗</a>
        </header>

        <!-- SECCIÓN DE PRODUCTOS -->
        <h3 style="color:var(--dorado); margin-bottom: 20px; font-size: 1.2rem; border-bottom: 2px solid var(--borde); padding-bottom: 8px;">Catálogo General de Productos</h3>
        <div class="products-grid" id="contenedor-productos">
            <!-- Carga dinámica sincronizada -->
        </div>

        <!-- SECCIÓN DEL CARRITO -->
        <div class="cart-drawer">
            <h3 style="color:var(--dorado); margin-bottom:15px; font-size: 1.2rem;">🛒 Tu Carrito de Compras</h3>
            <div id="items-carrito">
                <p style="color:var(--texto-dim); font-size:0.95rem;">El carrito está vacío.</p>
            </div>
            <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center; border-top: 1px solid var(--borde); padding-top: 15px;">
                <strong style="font-size:1.2rem;">Total: Bs. <span id="total-carrito">0</span></strong>
                <button class="cart-btn" onclick="abrirCheckout()">Finalizar Compra ➔</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE DATOS DE ENVÍO Y WHATSAPP -->
    <div class="overlay" id="checkoutOverlay">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="color:var(--dorado); margin:0;">Datos de Envío</h3>
                <button onclick="cerrarCheckout()" style="background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer;">✕</button>
            </div>

            <div id="checkoutForm">
                <label style="font-size:0.85rem; color:var(--texto-dim); display:block; margin-bottom:5px;">Nombre Completo</label>
                <input type="text" id="cName" placeholder="Ej. Juan Pérez">

                <label style="font-size:0.85rem; color:var(--texto-dim); display:block; margin-bottom:5px;">Ciudad</label>
                <input type="text" id="cCity" placeholder="Ej. La Paz / El Alto">

                <label style="font-size:0.85rem; color:var(--texto-dim); display:block; margin-bottom:5px;">Dirección de Entrega</label>
                <textarea id="cAddress" placeholder="Zona, calle, número de casa, referencia..." rows="3"></textarea>

                <button class="cart-btn" style="width:100%; margin-top:5px;" onclick="generarPedidoWhatsApp()">Confirmar y Pedir por WhatsApp</button>
            </div>

            <div id="checkoutDone" style="display:none; text-align:center; padding-top:10px;">
                <p style="font-size:0.9rem; color:var(--texto-dim); margin-bottom:20px;">¡Pedido preparado con éxito! Toca el botón para enviarlo directo al WhatsApp de la tienda:</p>
                <a id="waLink" href="#" target="_blank" style="display:block; background:var(--verde); color:#fff; text-decoration:none; padding:14px; font-weight:bold; border-radius:6px; font-size: 1.05rem;">Enviar a WhatsApp ↗</a>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "59163062304";

        const PRODUCTOS_BASE = [
            { id: 1, nombre: "Expression Sens (Ésika)", categoria: "Perfumería", precio: 145 },
            { id: 2, nombre: "Expression Magic (Ésika)", categoria: "Perfumería", precio: 145 },
            { id: 3, nombre: "Sweet Black Intense (Cyzone)", categoria: "Perfumería", precio: 115 },
            { id: 4, nombre: "All Black (Cyzone)", categoria: "Perfumería", precio: 115 },
            { id: 5, nombre: "Nitro Air (Cyzone)", categoria: "Perfumería", precio: 115 },
            { id: 6, nombre: "Sudadera Nike Clásica Naranja", categoria: "Ropa y Prendas", precio: 150 },
            { id: 7, nombre: "Sudadera Nike Fayetteville Tech", categoria: "Ropa y Prendas", precio: 150 },
            { id: 8, nombre: "Sweater Tommy Hilfiger", categoria: "Ropa y Prendas", precio: 160 },
            { id: 9, nombre: "Chaqueta Jordan Basketball", categoria: "Ropa y Prendas", precio: 180 },
            { id: 10, nombre: "Chamarra Gamuza con Forro Polar", categoria: "Ropa y Prendas", precio: 195 },
            { id: 11, nombre: "Chompa Cuello Redondo Varón", categoria: "Ropa y Prendas", precio: 130 },
            { id: 12, nombre: "Chompa Cuello en V Varón", categoria: "Ropa y Prendas", precio: 130 },
            { id: 13, nombre: "Chompa Cardigan Dama/Varón", categoria: "Ropa y Prendas", precio: 140 },
            { id: 14, nombre: "Chaqueta Polar Dama", categoria: "Ropa y Prendas", precio: 145 },
            { id: 15, nombre: "Chaleco Polar Unisex", categoria: "Ropa y Prendas", precio: 110 },
            { id: 16, nombre: "Collar Elegante Finart", categoria: "Ropa y Prendas", precio: 85 },
            { id: 17, nombre: "Aretes Dorados Finart", categoria: "Ropa y Prendas", precio: 65 },
            { id: 18, nombre: "Choker Ajustable de Moda", categoria: "Ropa y Prendas", precio: 50 }
        ];

        let products = [];
        let cart = [];

        function cargarProductos() {
            const guardados = localStorage.getItem("vyq_productos");
            if (guardados) {
                try {
                    products = JSON.parse(guardados);
                } catch(e) {
                    products = [...PRODUCTOS_BASE];
                }
            } else {
                products = [...PRODUCTOS_BASE];
                localStorage.setItem("vyq_productos", JSON.stringify(products));
            }
            renderizarCatalogo();
        }

        function renderizarCatalogo() {
            const container = document.getElementById("contenedor-productos");
            container.innerHTML = "";

            products.forEach(p => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <div>
                        <h4>${p.nombre}</h4>
                        <div class="category">${p.categoria}</div>
                    </div>
                    <div>
                        <div class="price">Bs. ${p.precio}</div>
                        <button class="btn-add" onclick="agregarAlCarrito(${p.id})">+ Agregar al carrito</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function agregarAlCarrito(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            const enCarrito = cart.find(item => item.id === id);
            if (enCarrito) {
                enCarrito.qty++;
            } else {
                cart.push({ id: prod.id, name: prod.nombre, price: prod.precio, qty: 1 });
            }
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const divItems = document.getElementById("items-carrito");
            const spanTotal = document.getElementById("total-carrito");

            if (cart.length === 0) {
                divItems.innerHTML = `<p style="color:var(--texto-dim); font-size:0.95rem;">El carrito está vacío.</p>`;
                spanTotal.innerText = "0";
                return;
            }

            divItems.innerHTML = "";
            let total = 0;

            cart.forEach(item => {
                const sub = item.price * item.qty;
                total += sub;
                const row = document.createElement("div");
                row.className = "cart-item";
                row.innerHTML = `
                    <span>${item.name} (x${item.qty})</span>
                    <strong>Bs. ${sub}</strong>
                `;
                divItems.appendChild(row);
            });

            spanTotal.innerText = total;
        }

        function abrirCheckout() {
            if (cart.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }
            document.getElementById("checkoutForm").style.display = "block";
            document.getElementById("checkoutDone").style.display = "none";
            document.getElementById("checkoutOverlay").style.display = "flex";
        }

        function cerrarCheckout() {
            document.getElementById("checkoutOverlay").style.display = "none";
        }

        function generarPedidoWhatsApp() {
            const name = document.getElementById("cName").value.trim();
            const city = document.getElementById("cCity").value.trim();
            const address = document.getElementById("cAddress").value.trim();

            if (!name || !city || !address) {
                alert("Por favor completa tu nombre, ciudad y dirección.");
                return;
            }

            let lines = [];
            let total = 0;

            cart.forEach(item => {
                const sub = item.price * item.qty;
                total += sub;
                lines.push("• " + item.name + " (x" + item.qty + ") — Bs. " + sub);
            });

            const msgText = "¡Hola TIENDA VYQ! 🛍️ Quiero realizar el siguiente pedido:\n\n" +
                lines.join("\n") + "\n\n" +
                "💰 *Total a pagar:* Bs. " + total + "\n\n" +
                "👤 *Cliente:* " + name + "\n" +
                "🏙️ *Ciudad:* " + city + "\n" +
                "📍 *Dirección:* " + address;

            const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msgText);
            
            document.getElementById("waLink").href = url;
            document.getElementById("checkoutForm").style.display = "none";
            document.getElementById("checkoutDone").style.display = "block";
        }

        cargar_inicio = cargarProductos();
    </script>
</body>
</html>
