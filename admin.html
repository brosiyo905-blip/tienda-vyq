<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Administración | TIENDA VYQ</title>

<style>
:root {
    --dorado: #d4af37;
    --dorado-hover: #f3e5ab;
    --negro: #0f1015;
    --tarjeta: #181a20;
    --gris: #222630;
    --borde: #323748;
    --blanco: #fff;
    --secundario: #a0a5b5;
    --verde: #28a745;
    --rojo: #dc3545;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: var(--negro);
    color: var(--blanco);
    min-height: 100vh;
}

header {
    background: var(--tarjeta);
    border-bottom: 3px solid var(--dorado);
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    background: var(--dorado);
    color: #111;
    padding: 8px 13px;
    font-weight: 900;
    border-radius: 5px;
}

header h1 {
    font-size: 20px;
    display: inline-block;
    margin-left: 10px;
}

header a {
    color: var(--dorado);
    text-decoration: none;
    border: 1px solid var(--dorado);
    padding: 9px 15px;
    border-radius: 5px;
}

main {
    max-width: 1250px;
    margin: 30px auto;
    padding: 15px;
}

.titulo {
    color: var(--dorado);
    margin-bottom: 20px;
    font-size: 24px;
}

.metricas {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-left: 4px solid var(--dorado);
    padding: 22px;
    border-radius: 9px;
}

.tarjeta h3 {
    color: var(--secundario);
    font-size: 13px;
    margin-bottom: 8px;
}

.tarjeta p {
    font-size: 27px;
    font-weight: bold;
}

.panel {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 25px;
}

.panel h2 {
    color: var(--dorado);
    margin-bottom: 20px;
    border-bottom: 1px solid var(--borde);
    padding-bottom: 12px;
}

.formulario {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 17px;
}

.campo {
    display: flex;
    flex-direction: column;
}

.campo label {
    margin-bottom: 7px;
    color: var(--secundario);
    font-weight: bold;
    font-size: 14px;
}

input, select, textarea {
    background: var(--gris);
    border: 1px solid var(--borde);
    color: white;
    padding: 12px;
    border-radius: 6px;
    outline: none;
    width: 100%;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--dorado);
}

textarea {
    resize: vertical;
    min-height: 75px;
}

.completo {
    grid-column: 1/-1;
}

.botones {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.btn {
    padding: 11px 17px;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

.dorado {
    background: var(--dorado);
    color: #111;
}

.dorado:hover {
    background: var(--dorado-hover);
}

.rojo {
    background: var(--rojo);
    color: white;
}

.gris {
    background: #454b59;
    color: white;
}

.tabla {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 750px;
    border-collapse: collapse;
}

th {
    background: var(--gris);
    color: var(--dorado);
    padding: 14px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid var(--borde);
}

td img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 5px;
}

.precio {
    color: var(--dorado);
    font-weight: bold;
}

.busqueda {
    margin-bottom: 18px;
    max-width: 400px;
}

#mensaje {
    margin-top: 15px;
    color: #75db91;
}

.acciones {
    display: flex;
    gap: 7px;
}

.acciones button {
    padding: 8px 10px;
    font-size: 12px;
}

footer {
    text-align: center;
    padding: 25px;
    background: var(--tarjeta);
    color: var(--secundario);
    border-top: 2px solid var(--dorado);
}

@media(max-width:650px) {
    .formulario {
        grid-template-columns: 1fr;
    }

    .completo {
        grid-column: auto;
    }

    header {
        justify-content: center;
        text-align: center;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <span class="logo">VYQ</span>
        <h1>PANEL DE ADMINISTRACIÓN</h1>
    </div>

    <a href="index.html">← VOLVER A LA TIENDA</a>
</header>

<main>

<h2 class="titulo">Dashboard Administrativo</h2>

<section class="metricas">

    <div class="tarjeta">
        <h3>TOTAL DE PRODUCTOS</h3>
        <p id="total-productos">0</p>
    </div>

    <div class="tarjeta">
        <h3>PERFUMERÍA</h3>
        <p id="total-perfumes">0</p>
    </div>

    <div class="tarjeta">
        <h3>ROPA Y PRENDAS</h3>
        <p id="total-ropa">0</p>
    </div>

</section>

<section class="panel">

<h2 id="titulo-form">Añadir nuevo producto</h2>

<form id="formulario">

<input type="hidden" id="id">

<div class="formulario">

    <div class="campo">
        <label>Categoría</label>
        <select id="categoria" required>
            <option value="perfumeria">Perfumería</option>
            <option value="ropa">Ropa y Prendas</option>
        </select>
    </div>

    <div class="campo">
        <label>Marca</label>
        <input type="text" id="marca" required>
    </div>

    <div class="campo completo">
        <label>Nombre del producto</label>
        <input type="text" id="nombre" required>
    </div>

    <div class="campo completo">
        <label>Descripción</label>
        <textarea id="descripcion" required></textarea>
    </div>

    <div class="campo">
        <label>Precio en bolivianos</label>
        <input type="number" id="precio"
        min="0.01" step="0.01" required>
    </div>

    <div class="campo">
        <label>Ruta de imagen</label>
        <input type="text" id="imagen"
        placeholder="img/producto.jpg">
    </div>

</div>

<div class="botones">

    <button type="submit" class="btn dorado" id="guardar">
        AÑADIR PRODUCTO
    </button>

    <button type="button" class="btn gris"
    onclick="limpiarFormulario()">
        CANCELAR
    </button>

</div>

<p id="mensaje"></p>

</form>

</section>


<section class="panel">

<h2>Gestión del catálogo</h2>

<input
type="text"
id="buscar"
class="busqueda"
placeholder="Buscar producto por nombre o marca..."
>

<div class="tabla">

<table>

<thead>
<tr>
    <th>Imagen</th>
    <th>Producto</th>
    <th>Categoría</th>
    <th>Precio</th>
    <th>Acciones</th>
</tr>
</thead>

<tbody id="lista"></tbody>

</table>

</div>

</section>

</main>

<footer>
    © 2026 TIENDA VYQ | Sistema de Administración
</footer>


<script>

const CLAVE = "tiendaVYQ_productos_v1";

let productos = JSON.parse(
    localStorage.getItem(CLAVE) || "[]"
);

const $ = id => document.getElementById(id);


// GUARDAR EN LOCALSTORAGE

function guardarDatos() {

    localStorage.setItem(
        CLAVE,
        JSON.stringify(productos)
    );

    mostrarProductos();

}


// MOSTRAR PRODUCTOS

function mostrarProductos() {

    const lista = $("lista");

    const buscar = $("buscar").value.toLowerCase();

    lista.innerHTML = "";

    productos.forEach((p, index) => {

        if (
            !p.nombre.toLowerCase().includes(buscar) &&
            !p.marca.toLowerCase().includes(buscar)
        ) return;

        const fila = document.createElement("tr");

        const imagen = document.createElement("td");
        const img = document.createElement("img");

        img.src = p.imagen || "";
        img.alt = p.nombre;
        img.onerror = () => img.style.visibility = "hidden";

        imagen.appendChild(img);

        const nombre = document.createElement("td");
        nombre.textContent = p.nombre + " - " + p.marca;

        const categoria = document.createElement("td");
        categoria.textContent =
            p.categoria === "ropa" ? "Ropa" : "Perfumería";

        const precio = document.createElement("td");
        precio.className = "precio";
        precio.textContent = "Bs. " + Number(p.precio).toFixed(2);

        const acciones = document.createElement("td");
        acciones.className = "acciones";

        const editar = document.createElement("button");
        editar.className = "btn dorado";
        editar.textContent = "EDITAR";
        editar.onclick = () => editarProducto(index);

        const eliminar = document.createElement("button");
        eliminar.className = "btn rojo";
        eliminar.textContent = "ELIMINAR";
        eliminar.onclick = () => eliminarProducto(index);

        acciones.append(editar, eliminar);

        fila.append(imagen, nombre, categoria, precio, acciones);

        lista.appendChild(fila);

    });

    actualizarMetricas();

}


// ACTUALIZAR ESTADÍSTICAS

function actualizarMetricas() {

    $("total-productos").textContent = productos.length;

    $("total-perfumes").textContent =
        productos.filter(p => p.categoria === "perfumeria").length;

    $("total-ropa").textContent =
        productos.filter(p => p.categoria === "ropa").length;

}


// AÑADIR O MODIFICAR PRODUCTOS

$("formulario").addEventListener("submit", function(e) {

    e.preventDefault();

    const id = $("id").value;

    const producto = {

        id: id || (
            crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now())
        ),

        categoria: $("categoria").value,

        marca: $("marca").value.trim(),

        nombre: $("nombre").value.trim(),

        descripcion: $("descripcion").value.trim(),

        precio: Number($("precio").value),

        imagen: $("imagen").value.trim()

    };

    if (
        !producto.nombre ||
        !producto.marca ||
        !producto.descripcion ||
        !Number.isFinite(producto.precio) ||
        producto.precio <= 0
    ) {
        alert("Completa correctamente los campos.");
        return;
    }

    if(id !== "") {

        const index = productos.findIndex(p => p.id === id);

        if(index !== -1) {
            productos[index] = producto;
        }

        $("mensaje").textContent =
            "Producto actualizado correctamente.";

    } else {

        productos.push(producto);

        $("mensaje").textContent =
            "Producto añadido correctamente.";

    }

    guardarDatos();

    limpiarFormulario();

});


// EDITAR PRODUCTO

function editarProducto(index) {

    const p = productos[index];

    $("id").value = p.id;

    $("categoria").value = p.categoria;

    $("marca").value = p.marca;

    $("nombre").value = p.nombre;

    $("descripcion").value = p.descripcion;

    $("precio").value = p.precio;

    $("imagen").value = p.imagen || "";

    $("titulo-form").textContent = "Modificar producto";

    $("guardar").textContent = "GUARDAR CAMBIOS";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ELIMINAR PRODUCTO

function eliminarProducto(index) {

    if(confirm("¿Deseas eliminar este producto?")) {

        productos.splice(index, 1);

        guardarDatos();

    }

}


// LIMPIAR FORMULARIO

function limpiarFormulario() {

    $("formulario").reset();

    $("id").value = "";

    $("titulo-form").textContent =
        "Añadir nuevo producto";

    $("guardar").textContent =
        "AÑADIR PRODUCTO";

    $("mensaje").textContent = "";

}


// BUSCADOR

$("buscar").addEventListener("input", mostrarProductos);


// ACTUALIZACIÓN AUTOMÁTICA SI CAMBIA OTRA PESTAÑA

window.addEventListener("storage", function(e) {

    if(e.key === CLAVE) {

        productos = JSON.parse(e.newValue || "[]");

        mostrarProductos();

    }

});

mostrarProductos();

</script>

</body>
</html>
