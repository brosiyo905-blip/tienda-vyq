<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | TIENDA VYQ</title>
    <style>
        :root {
            --dorado: #d4af37;
            --negro: #12141c;
            --tarjeta: #1b1e29;
            --borde: #323748;
            --texto: #f8f9fa;
            --texto-dim: #9ba0b2;
            --verde: #28a745;
            --rojo: #dc3545;
            --azul: #17a2b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--negro); color: var(--texto); padding: 15px; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--tarjeta); padding: 15px 20px; border-radius: 10px; border: 1px solid var(--borde); margin-bottom: 20px; }
        header h1 { font-size: 1.3rem; color: var(--dorado); }
        header a { color: var(--texto); text-decoration: none; font-size: 0.85rem; background: #242836; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--borde); }

        .container { max-width: 1000px; margin: 0 auto; }
        
        .card { background: var(--tarjeta); padding: 20px; border-radius: 10px; border: 1px solid var(--borde); margin-bottom: 20px; }
        .card h3 { color: var(--dorado); margin-bottom: 15px; font-size: 1.1rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--tarjeta); padding: 15px; border-radius: 8px; border: 1px solid var(--borde); border-left: 4px solid var(--dorado); }
        .stat-box h4 { font-size: 0.75rem; color: var(--texto-dim); text-transform: uppercase; }
        .stat-box p { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }

        .form-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .form-grid input, .form-grid select { background: #12141c; border: 1px solid var(--borde); color: var(--texto); padding: 10px; border-radius: 6px; font-size: 0.9rem; flex: 1; min-width: 150px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-gold { background: var(--dorado); color: #121212; }
        .btn-reset { background: var(--azul); color: #fff; margin-bottom: 15px; }
        .btn-save { background: var(--verde); color: #fff; padding: 6px 10px; }
        .btn-del { background: var(--rojo); color: #fff; padding: 6px 10px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--borde); }
        th { background: #242836; color: var(--dorado); font-size: 0.8rem; text-transform: uppercase; }

        .price-input { width: 85px; background: #12141c; border: 1px solid var(--borde); color: var(--dorado); font-weight: bold; padding: 6px; border-radius: 4px; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TIENDA VYQ | Panel Admin</h1>
            <a href="index.html" target="_blank">Ver Tienda Pública ↗</a>
        </header>

        <!-- ESTADÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-box">
                <h4>Total Productos</h4>
                <p id="total-prod">18</p>
            </div>
            <div class="stat-box">
                <h4>WhatsApp Pedidos</h4>
                <p style="font-size:1.1rem; color:var(--verde);">+591 63062304</p>
            </div>
        </div>

        <!-- ACCIONES Y AGREGAR -->
        <div class="card">
            <h3>Gestión de Productos</h3>
            <button class="btn btn-reset" onclick="restablecer18()">🔄 Cargar / Restablecer 18 Productos Oficiales</button>
            
            <form id="form-nuevo" onsubmit="agregarProducto(event)">
                <div class="form-grid">
                    <input type="text" id="nuevo-nombre" placeholder="Nombre del producto" required>
                    <select id="nueva-cat" required>
                        <option value="">Seleccionar Categoría</option>
                        <option value="Perfumería">Perfumería</option>
                        <option value="Ropa y Prendas">Ropa y Prendas</option>
                    </select>
                    <input type="number" id="nuevo-precio" placeholder="Precio (Bs.)" min="1" required>
                    <button type="submit" class="btn btn-gold">+ Agregar</button>
                </div>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio (Bs.)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Los 18 productos oficiales
        const PRODUCTOS_BASE = [
            { id: 1, nombre: "Expression Sens (Ésika)", categoria: "Perfumería", precio: 145 },
            { id: 2, nombre: "Expression Magic (Ésika)", categoria: "Perfumería", precio: 145 },
            { id: 3, nombre: "Sweet Black Intense (Cyzone)", categoria: "Perfumería", precio: 115 },
            { id: 4, nombre: "All Black (Cyzone)", categoria: "Perfumería", precio: 115 },
            { id: 5, nombre: "Nitro Air (Cyzone)", categoria: "Perfumería", precio: 115 },
            { id: 6, nombre: "Sudadera Nike Clásica Naranja", categoria: "Ropa y Prendas", precio: 150 },
            { id: 7, nombre: "Sudadera Nike Fayetteville Tech", categoria: "Ropa y Prendas", precio: 150 },
            { id: 8, nombre: "Sweater Tommy Hilfiger", categoria: "Ropa y Prendas", precio: 160 },
            { id: 9, nombre: "Chaqueta Jordan Basketball", categoria: "Ropa y Prendas", precio: 180 },
            { id: 10, nombre: "Chamarra Gamuza con Forro Polar", categoria: "Ropa y Prendas", precio: 195 },
            { id: 11, nombre: "Chompa Cuello Redondo Varón", categoria: "Ropa y Prendas", precio: 130 },
            { id: 12, nombre: "Chompa Cuello en V Varón", categoria: "Ropa y Prendas", precio: 130 },
            { id: 13, nombre: "Chompa Cardigan Dama/Varón", categoria: "Ropa y Prendas", precio: 140 },
            { id: 14, nombre: "Chaqueta Polar Dama", categoria: "Ropa y Prendas", precio: 145 },
            { id: 15, nombre: "Chaleco Polar Unisex", categoria: "Ropa y Prendas", precio: 110 },
            { id: 16, nombre: "Collar Elegante Finart", categoria: "Ropa y Prendas", precio: 85 },
            { id: 17, nombre: "Aretes Dorados Finart", categoria: "Ropa y Prendas", precio: 65 },
            { id: 18, nombre: "Choker Ajustable de Moda", categoria: "Ropa y Prendas", precio: 50 }
        ];

        let productos = [];

        function inicializar() {
            const guardados = localStorage.getItem("vyq_productos");
            if (guardados) {
                try {
                    productos = JSON.parse(guardados);
                    if (!Array.isArray(productos) || productos.length === 0) {
                        productos = [...PRODUCTOS_BASE];
                    }
                } catch(e) {
                    productos = [...PRODUCTOS_BASE];
                }
            } else {
                productos = [...PRODUCTOS_BASE];
            }
            guardarYRenderizar();
        }

        function guardarYRenderizar() {
            localStorage.setItem("vyq_productos", JSON.stringify(productos));
            document.getElementById("total-prod").innerText = productos.length;

            const tbody = document.getElementById("tabla-body");
            tbody.innerHTML = "";

            productos.forEach((p, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><b>#${index + 1}</b></td>
                    <td>${p.nombre}</td>
                    <td><small style="color:var(--texto-dim);">${p.categoria}</small></td>
                    <td>Bs. <input type="number" id="price-${p.id}" class="price-input" value="${p.precio}" min="1"></td>
                    <td>
                        <button class="btn btn-save" onclick="guardarPrecio(${p.id})">💾 Guardar</button>
                        <button class="btn btn-del" onclick="borrarProducto(${p.id})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function guardarPrecio(id) {
            const input = document.getElementById(`price-${id}`);
            if (!input) return;
            const nuevoPrecio = parseFloat(input.value);
            if (isNaN(nuevoPrecio) || nuevoPrecio <= 0) {
                alert("Por favor ingresa un precio válido.");
                return;
            }
            const prod = productos.find(p => p.id === id);
            if (prod) {
                prod.precio = nuevoPrecio;
                guardarYRenderizar();
                alert(`¡Precio actualizado a Bs. ${nuevoPrecio} para "${prod.nombre}"!`);
            }
        }

        function borrarProducto(id) {
            const prod = productos.find(p => p.id === id);
            if (prod && confirm(`¿Eliminar "${prod.nombre}"?`)) {
                productos = productos.filter(p => p.id !== id);
                guardarYRenderizar();
            }
        }

        function agregarProducto(e) {
            e.preventDefault();
            const nombre = document.getElementById("nuevo-nombre").value.trim();
            const categoria = document.getElementById("nueva-cat").value;
            const precio = parseFloat(document.getElementById("nuevo-precio").value);

            if (!nombre || !categoria || isNaN(precio)) return;

            productos.push({ id: Date.now(), nombre, categoria, precio });
            document.getElementById("form-nuevo").reset();
            guardarYRenderizar();
        }

        function restablecer18() {
            if (confirm("¿Restablecer los 18 productos oficiales?")) {
                productos = [...PRODUCTOS_BASE];
                guardarYRenderizar();
                alert("¡Se cargaron los 18 productos correctamente!");
            }
        }

        inicializar();
    </script>
</body>
</html>
