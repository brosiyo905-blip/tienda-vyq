<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Avanzado | TIENDA VYQ</title>
    <style>
        /* ==========================================================================
           1. VARIABLES GLOBALES Y ESTILOS BASE (DARK GOLD THEME)
           ========================================================================== */
        :root {
            --dorado: #d4af37;
            --dorado-hover: #f3e5ab;
            --dorado-oscuro: #997a15;
            --negro: #0f1015;
            --negro-tarjeta: #181a20;
            --gris-oscuro: #222630;
            --gris-borde: #323748;
            --texto-blanco: #ffffff;
            --texto-secundario: #a0a5b5;
            --verde-exito: #28a745;
            --rojo-peligro: #dc3545;
            --azul-info: #17a2b8;
            --fuente-principal: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--fuente-principal);
        }

        body {
            background-color: var(--negro);
            color: var(--texto-blanco);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           2. ENCABEZADO Y NAVEGACIÓN
           ========================================================================== */
        header {
            background-color: var(--negro-tarjeta);
            border-bottom: 3px solid var(--dorado);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            background: var(--dorado);
            color: var(--negro);
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--texto-blanco);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-link-tienda {
            color: var(--dorado);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            border: 1px solid var(--dorado);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .btn-link-tienda:hover {
            background-color: var(--dorado);
            color: var(--negro);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* ==========================================================================
           3. ESTRUCTURA PRINCIPAL Y CONTENEDORES
           ========================================================================== */
        .admin-wrapper {
            max-width: 1300px;
            margin: 25px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        /* Dashboard Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .metric-card {
            background-color: var(--negro-tarjeta);
            border: 1px solid var(--gris-borde);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .metric-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--dorado);
        }

        .metric-info h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--texto-secundario);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .metric-info p {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--texto-blanco);
        }

        .metric-icon {
            font-size: 2rem;
            opacity: 0.3;
            color: var(--dorado);
        }

        /* Action Toolbar */
        .toolbar-panel {
            background-color: var(--negro-tarjeta);
            border: 1px solid var(--gris-borde);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 280px;
        }

        .form-control {
            background-color: var(--gris-oscuro);
            border: 1px solid var(--gris-borde);
            color: var(--texto-blanco);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--dorado);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary { background-color: var(--dorado); color: var(--negro); }
