<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN | TIENDA VYQ</title>

<style>
:root {
    --dorado: #d4af37;
    --negro: #121212;
    --gris: #1e1e1e;
    --fondo: #f4f5f7;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: var(--fondo);
    color: #222;
}

header {
    background: var(--negro);
    color: var(--dorado);
    text-align: center;
    padding: 25px;
    border-bottom: 4px solid var(--dorado);
}

header h1 {
    letter-spacing: 3px;
}

header p {
    color: white;
    margin-top: 5px;
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px #00000012;
}

h2 {
    margin-bottom: 20px;
    border-left: 5px solid var(--dorado);
    padding-left: 10px;
}

.formulario {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.campo {
    display: flex;
    flex-direction: column;
}

.campo label {
    font-weight: bold;
    margin-bottom: 6px;
}

.campo input,
.campo select,
.campo textarea {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

.completo {
    grid-column: 1 / -1;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.guardar {
    background: var(--dorado);
    color: black;
}

.cancelar {
    background: #555;
    color: white;
}

.editar {
    background: #d4af37;
    color: black;
    margin: 3px;
}

.eliminar {
    background: #c62828;
    color: white;
    margin: 3px;
}

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: var(--gris);
    color: white;
}

td img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 5px;
}

.precio {
    font-weight: bold;
    color: #b12704;
}

#mensaje {
    margin-top: 15px;
    font-weight: bold;
    color: green;
}

@media(max-width:600px) {
    .formulario {
        grid-template-columns: 1fr;
    }

    .completo {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<header>
    <h1>TIENDA VYQ</h1>
    <p>Panel de administración</p>
</header>

<main>

<section class="panel">

<h2 id="titulo-formulario">Añadir nuevo producto</h2>

<form id="formulario">

<input type="hidden" id="id">

<div class="formulario">

<div class="campo">
<label>Categoría</label>
<select id="categoria" required>
<option value="perfumeria">Perfumería</option>
<option value="ropa">Ropa y Prendas</option>
</select>
</div>

<div class="campo">
<label>Marca</label>
<input type="text" id="marca" required>
</div>

<div class="campo completo">
<label>Nombre del producto</label>
<input type="text" id="nombre" required>
</div>

<div class="campo completo">
<label>Descripción</label>
<textarea id="descripcion" required></textarea>
</div>

<div class="campo">
<label>Precio (Bs.)</label>
<input type="number" id="precio" min="0.01" step="0.01" required>
</div>

<div class="campo">
<label>Imagen (ruta)</label>
<input type="text" id="imagen" placeholder="img/producto.jpg">
</div>

</div>

<br>

<button type="submit" class="guardar" id="btn-guardar">
AÑADIR PRODUCTO
</button>

<button type="button" class="cancelar" onclick="limpiarFormulario()">
CANCELAR
</button>

<p id="mensaje"></p>

</form>

</section>


<section class="panel">

<h2>Productos registrados</h2>

<input
type="text"
id="buscador"
placeholder="Buscar producto..."
style="width:100%;padding:12px;margin-bottom:20px;border:1px solid #ccc;border-radius:6px;"
>

<div class="tabla-contenedor">

<table>

<thead>
<tr>
<th>Imagen</th>
<th>Producto</th>
<th>Categoría</th>
<th>Precio</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="lista-productos"></tbody>

</table>

</div>

</section>

</main>


<script>

const CLAVE = "tiendaVYQ_productos_v1";

let productos = JSON.parse(localStorage.getItem(CLAVE) || "[]");


function guardarDatos() {

    localStorage.setItem(CLAVE, JSON.stringify(productos));

    mostrarProductos();

}


function mostrarProductos() {

    const lista = document.getElementById("lista-productos");

    const busqueda = document.getElementById("buscador")
        .value.toLowerCase();

    lista.innerHTML = "";

    productos.forEach((p, index) => {

        if (
            !p.nombre.toLowerCase().includes(busqueda) &&
            !p.marca.toLowerCase().includes(busqueda)
        ) return;

        lista.innerHTML += `

        <tr>

            <td>
                <img src="${p.imagen || ''}"
                onerror="this.style.display='none'">
            </td>

            <td>
                <strong>${p.nombre}</strong><br>
                ${p.marca}
            </td>

            <td>
                ${p.categoria === "ropa" ? "Ropa" : "Perfumería"}
            </td>

            <td class="precio">
                Bs. ${Number(p.precio).toFixed(2)}
            </td>

            <td>

                <button class="editar"
                onclick="editarProducto(${index})">
                    EDITAR
                </button>

                <button class="eliminar"
                onclick="eliminarProducto(${index})">
                    ELIMINAR
                </button>

            </td>

        </tr>

        `;

    });

}


document.getElementById("formulario")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const id = document.getElementById("id").value;

    const producto = {

        categoria: document.getElementById("categoria").value,

        marca: document.getElementById("marca").value.trim(),

        nombre: document.getElementById("nombre").value.trim(),

        descripcion: document.getElementById("descripcion").value.trim(),

        precio: Number(document.getElementById("precio").value),

        imagen: document.getElementById("imagen").value.trim()

    };

    if (!producto.nombre || !producto.marca ||
        !producto.descripcion || producto.precio <= 0) {

        alert("Completa correctamente todos los campos.");

        return;

    }

    if (id !== "") {

        productos[Number(id)] = producto;

        document.getElementById("mensaje").textContent =
            "Producto actualizado correctamente.";

    } else {

        productos.push(producto);

        document.getElementById("mensaje").textContent =
            "Producto añadido correctamente.";

    }

    guardarDatos();

    limpiarFormulario();

});


function editarProducto(index) {

    const p = productos[index];

    document.getElementById("id").value = index;

    document.getElementById("categoria").value = p.categoria;

    document.getElementById("marca").value = p.marca;

    document.getElementById("nombre").value = p.nombre;

    document.getElementById("descripcion").value = p.descripcion;

    document.getElementById("precio").value = p.precio;

    document.getElementById("imagen").value = p.imagen || "";

    document.getElementById("titulo-formulario").textContent =
        "Modificar producto";

    document.getElementById("btn-guardar").textContent =
        "GUARDAR CAMBIOS";

    window.scrollTo({top: 0, behavior: "smooth"});

}


function eliminarProducto(index) {

    if (confirm("¿Estás seguro de eliminar este producto?")) {

        productos.splice(index, 1);

        guardarDatos();

    }

}


function limpiarFormulario() {

    document.getElementById("formulario").reset();

    document.getElementById("id").value = "";

    document.getElementById("titulo-formulario").textContent =
        "Añadir nuevo producto";

    document.getElementById("btn-guardar").textContent =
        "AÑADIR PRODUCTO";

}


document.getElementById("buscador")
.addEventListener("input", mostrarProductos);


mostrarProductos();

</script>

</body>
</html>
